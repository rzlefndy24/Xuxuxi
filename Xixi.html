<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>OP Raw Bytecode Deployer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0d;
      color: #f3f3f3;
      min-height: 100vh;
      padding: 20px;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }
    h1 { font-size: 24px; margin: 4px 0 8px; }
    p { color: #aaa; line-height: 1.45; }
    .card {
      background: #151518;
      border: 1px solid #2b2b31;
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    #connect { background: #fff; color: #111; }
    #deploy { background: #ff0420; color: white; }
    #deploy:disabled { opacity: .45; cursor: not-allowed; }
    textarea, input {
      width: 100%;
      background: #0c0c0f;
      border: 1px solid #34343b;
      color: white;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
      outline: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    textarea { min-height: 260px; resize: vertical; }
    label { display:block; margin-top: 14px; font-size: 14px; color:#ccc; }
    .row {
      display:flex;
      justify-content:space-between;
      gap:12px;
      font-size:14px;
      padding:8px 0;
      border-bottom:1px solid #25252b;
    }
    .row:last-child { border-bottom:0; }
    .muted { color:#888; overflow-wrap:anywhere; text-align:right; }
    #status {
      white-space: pre-wrap;
      overflow-wrap:anywhere;
      background:#0c0c0f;
      border-radius:12px;
      padding:12px;
      min-height:48px;
      margin-top:12px;
      color:#ccc;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size:13px;
    }
    .ok { color:#6ee7a8; }
    .bad { color:#ff7a88; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>OP Raw Bytecode Deployer</h1>
  <p>Deploy creation bytecode langsung dari wallet EOA ke Optimism. Tidak pakai factory, jadi <code>msg.sender</code> saat constructor adalah wallet kamu.</p>

  <div class="card">
    <div class="row"><span>Network</span><span id="network" class="muted">Belum connect</span></div>
    <div class="row"><span>Wallet</span><span id="account" class="muted">-</span></div>
    <button id="connect">CONNECT WALLET</button>
  </div>

  <div class="card">
    <label for="bytecode">Creation bytecode</label>
    <textarea id="bytecode" spellcheck="false" placeholder="0x6080604052..."></textarea>

    <label for="value">Value ETH (opsional)</label>
    <input id="value" value="0" inputmode="decimal" placeholder="0" />

    <button id="deploy" disabled>DEPLOY TO OPTIMISM</button>
    <div id="status">Siap.</div>
  </div>
</div>

<script>
const OP_CHAIN_ID = "0xa"; // 10
let account = null;

const $ = (id) => document.getElementById(id);
const status = (text, cls="") => {
  $("status").className = cls;
  $("status").textContent = text;
};

function ethToWeiHex(value) {
  value = String(value || "0").trim();
  if (!/^\d+(\.\d+)?$/.test(value)) throw new Error("Value ETH tidak valid");
  let [whole, frac=""] = value.split(".");
  if (frac.length > 18) throw new Error("Maksimal 18 digit desimal");
  frac = frac.padEnd(18, "0");
  const wei = BigInt(whole) * (10n ** 18n) + BigInt(frac || "0");
  return "0x" + wei.toString(16);
}

async function ensureOptimism() {
  const chainId = await ethereum.request({ method: "eth_chainId" });
  if (chainId.toLowerCase() === OP_CHAIN_ID) return;

  try {
    await ethereum.request({
      method: "wallet_switchEthereumChain",
      params: [{ chainId: OP_CHAIN_ID }]
    });
  } catch (err) {
    if (err.code === 4902) {
      await ethereum.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: OP_CHAIN_ID,
          chainName: "OP Mainnet",
          nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
          rpcUrls: ["https://mainnet.optimism.io"],
          blockExplorerUrls: ["https://optimistic.etherscan.io"]
        }]
      });
    } else {
      throw err;
    }
  }
}

async function refresh() {
  if (!window.ethereum) {
    $("network").textContent = "Provider wallet tidak ditemukan";
    $("deploy").disabled = true;
    return;
  }
  const chainId = await ethereum.request({ method: "eth_chainId" });
  $("network").textContent = chainId.toLowerCase() === OP_CHAIN_ID
    ? "Optimism (10)"
    : `Chain ${parseInt(chainId,16)}`;
  if (account) {
    $("account").textContent = account;
    $("deploy").disabled = chainId.toLowerCase() !== OP_CHAIN_ID;
  }
}

$("connect").onclick = async () => {
  try {
    if (!window.ethereum) {
      throw new Error("Provider wallet tidak ditemukan. Buka halaman ini dari browser Rabby/MetaMask atau browser yang wallet-nya inject window.ethereum.");
    }

    await ensureOptimism();

    const accounts = await ethereum.request({ method: "eth_requestAccounts" });
    account = accounts[0];
    await refresh();

    status("Wallet terhubung. Paste CREATION bytecode lalu tekan DEPLOY.", "ok");
  } catch (e) {
    status("ERROR: " + (e?.message || e), "bad");
  }
};

$("deploy").onclick = async () => {
  try {
    if (!account) throw new Error("Connect wallet dulu.");
    await ensureOptimism();

    const code = $("bytecode").value.trim();
    if (!/^0x[0-9a-fA-F]+$/.test(code)) {
      throw new Error("Bytecode harus hex valid dan diawali 0x.");
    }
    if ((code.length - 2) % 2 !== 0) {
      throw new Error("Panjang bytecode hex harus genap.");
    }

    const valueHex = ethToWeiHex($("value").value);

    status("Meminta wallet menandatangani deployment...");

    const txHash = await ethereum.request({
      method: "eth_sendTransaction",
      params: [{
        from: account,
        data: code,
        value: valueHex
        // Sengaja TANPA field `to`: ini contract creation langsung dari EOA.
      }]
    });

    status("TX terkirim:\n" + txHash + "\n\nMenunggu receipt...");

    let receipt = null;
    while (!receipt) {
      await new Promise(r => setTimeout(r, 1800));
      receipt = await ethereum.request({
        method: "eth_getTransactionReceipt",
        params: [txHash]
      });
    }

    if (receipt.status === "0x0") {
      throw new Error("Transaction reverted.\nTX: " + txHash);
    }

    status(
      "DEPLOY SUCCESS\n\nTX:\n" + txHash +
      "\n\nCONTRACT:\n" + (receipt.contractAddress || "(alamat tidak dikembalikan RPC)") ,
      "ok"
    );
  } catch (e) {
    status("ERROR: " + (e?.message || e), "bad");
  }
};

if (window.ethereum) {
  ethereum.on?.("accountsChanged", (accounts) => {
    account = accounts?.[0] || null;
    refresh();
  });
  ethereum.on?.("chainChanged", () => refresh());
}

refresh();
</script>
</body>
</html>
